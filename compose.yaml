services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployment-lab-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      APP_VERSION: 1.0.0
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: deployment_lab
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deployment-lab-network

  postgres:
    image: postgres:16-alpine
    container_name: deployment-lab-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: deployment_lab
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d deployment_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deployment-lab-network

volumes:
  postgres-data:

networks:
  deployment-lab-network:
